spring:
  threads:
    virtual:
      enabled: true
  application:
    name: voltix-core

  datasource:
    url: jdbc:postgresql://localhost:5433/voltix_grid
    username: voltix_admin
    password: voltix_secure_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 250
      maximum-pool-size: 200

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Database schema strictly governed by Flyway versioning
    show-sql: false
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 50 # Prerequisite configuration for Phase 2 batch operations
      hibernate.order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  tomcat:
    max-connections: 5000
    accept-count: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

voltix:
  tenant:
    default-id: 1
  telemetry:
    executor:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 5000
    validation:
      min-voltage: 200.0
      max-voltage: 260.0
      max-past-skew-minutes: 5
      max-future-skew-minutes: 1
    batch:
      max-size: 500
      flush-interval-ms: 250
    partitions:
      days-ahead: 14
  analytics:
    anomaly-model: classpath:models/anomaly_forest.onnx
    load-forecaster-model: classpath:models/load_forecaster.onnx
    onnx-session-pool-size: 4
  complaints:
    dedup-window-minutes: 60
    rate-limit-capacity: 20
    rate-limit-refill-minutes: 1
  security:
    jwt-secret: "replace-this-development-secret-with-at-least-32-bytes"
